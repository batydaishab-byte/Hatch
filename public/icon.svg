<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#amberGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Radiant Hatch Egg Motif -->
  <ellipse cx="256" cy="256" rx="170" ry="200" fill="none" stroke="url(#amberGrad)" stroke-width="14" filter="url(#glow)" />

  <!-- Inner Amber Glow Circle -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" fill-opacity="0.08" />

  <!-- Arabic Typography "هـ" combined with Hatch "H" -->
  <text x="256" y="295" font-family="'Cairo', sans-serif" font-size="160" font-weight="900" fill="url(#amberGrad)" text-anchor="middle" letter-spacing="-2">
    هـ
  </text>

  <!-- Brand Wordmark -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="6">
    HATCH
  </text>

  <!-- Active Online Dot -->
  <circle cx="380" cy="140" r="14" fill="#10b981" stroke="#0a0a0a" stroke-width="4" />
</svg>
