name: Build HATCH Android Native APK

on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build & Verify HATCH Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses & Install Platform 35 + Build Tools 35.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure optional Firebase google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json configured from repository secret."
          else
            echo "No GOOGLE_SERVICES_JSON secret provided; building experimental APK with Firebase fallback."
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          gradle-home-cache-cleanup: true

      - name: Prepare Persistent Android Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          KEYSTORE_PATH="${RUNNER_TEMP}/hatch-signing.jks"
          export KEYSTORE_PATH
          rm -f "$KEYSTORE_PATH"

          MISSING=()
          [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] && MISSING+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] && MISSING+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${ANDROID_KEY_ALIAS:-}" ] && MISSING+=("ANDROID_KEY_ALIAS")
          [ -z "${ANDROID_KEY_PASSWORD:-}" ] && MISSING+=("ANDROID_KEY_PASSWORD")

          if [ "${#MISSING[@]}" -gt 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "Pull request check without repository signing secrets; persistent signing skipped for PR verification only."
              echo "HATCH_REQUIRE_PERSISTENT_SIGNING=false" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "ERROR: Missing required GitHub Secrets for persistent APK signing: ${MISSING[*]}"
            echo "Aborting build to avoid generating an APK signed with a mismatched temporary debug key."
            exit 1
          fi

          if ! python3 - <<'PY'
          import base64
          import binascii
          import os
          import re
          import sys

          raw = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          keystore_path = os.environ["KEYSTORE_PATH"]

          invisible_chars = (
              "\ufeff\u200b\u200c\u200d\u200e\u200f"
              "\u202a\u202b\u202c\u202d\u202e"
              "\u2066\u2067\u2068\u2069\u00a0"
          )
          cleaned = re.sub(r"\s+", "", raw).translate({ord(c): None for c in invisible_chars})
          if len(cleaned) >= 2 and cleaned[0] == cleaned[-1] and cleaned[0] in ("'", '"'):
              cleaned = cleaned[1:-1]
          if ";base64," in cleaned[:80]:
              cleaned = cleaned.split(";base64,", 1)[1]
          cleaned = cleaned.replace("-", "+").replace("_", "/")

          if not cleaned or not re.fullmatch(r"[A-Za-z0-9+/]+=*", cleaned):
              print(
                  f"ERROR: Failed to decode ANDROID_KEYSTORE_BASE64 (invalid Base64 format; cleaned_length={len(cleaned)}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          rem = len(cleaned) % 4
          if rem == 1:
              print(
                  f"ERROR: Failed to decode ANDROID_KEYSTORE_BASE64 (truncated Base64 length={len(cleaned)}, mod4=1).",
                  file=sys.stderr,
              )
              sys.exit(1)
          if rem in (2, 3):
              cleaned += "=" * (4 - rem)

          try:
              decoded = base64.b64decode(cleaned, validate=True)
          except binascii.Error as exc:
              print(
                  f"ERROR: Failed to decode ANDROID_KEYSTORE_BASE64 ({exc}; cleaned_length={len(cleaned)}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          if not decoded:
              print("ERROR: Decoded keystore file is empty.", file=sys.stderr)
              sys.exit(1)

          with open(keystore_path, "wb") as f:
              f.write(decoded)

          print(f"Decoded ANDROID_KEYSTORE_BASE64 successfully ({len(decoded)} bytes).")
          PY
          then
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            rm -f "$KEYSTORE_PATH"
            echo "ERROR: Decoded keystore file is empty."
            exit 1
          fi

          chmod 600 "$KEYSTORE_PATH"

          CLEAN_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$CLEAN_ALIAS" >/dev/null 2>&1; then
            rm -f "$KEYSTORE_PATH"
            echo "ERROR: Keystore validation failed. Verify ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS."
            exit 1
          fi

          echo "HATCH_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "HATCH_REQUIRE_PERSISTENT_SIGNING=true" >> "$GITHUB_ENV"
          echo "Persistent signing keystore ready in temporary runner directory."

      - name: Run Unit Tests & Assemble Debug APK (android-native only)
        env:
          HATCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HATCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HATCH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Extract APK Signing Certificate Fingerprints (SHA-1 & SHA-256)
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH was not generated or is empty."
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH")

          SHA1_HEX=$(echo "$CERT_OUTPUT" | sed -n 's/.*SHA-1 digest: \([0-9a-fA-F]*\).*/\1/p' | head -n 1)
          SHA256_HEX=$(echo "$CERT_OUTPUT" | sed -n 's/.*SHA-256 digest: \([0-9a-fA-F]*\).*/\1/p' | head -n 1)

          if [ -z "$SHA1_HEX" ] || [ -z "$SHA256_HEX" ]; then
            echo "ERROR: Failed to parse SHA-1 or SHA-256 digest from apksigner output."
            exit 1
          fi

          format_colons() {
            echo "$1" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//'
          }

          SHA1_FORMATTED=$(format_colons "$SHA1_HEX")
          SHA256_FORMATTED=$(format_colons "$SHA256_HEX")

          echo "=========================================="
          echo "Package Name : com.hatch.marketplace"
          echo "SHA-1        : $SHA1_FORMATTED"
          echo "SHA-1 (hex)  : $SHA1_HEX"
          echo "SHA-256      : $SHA256_FORMATTED"
          echo "SHA-256 (hex): $SHA256_HEX"
          echo "=========================================="

          EXPECTED_SHA1="18:65:F4:90:74:ED:11:C8:92:1B:05:75:C1:18:32:AB:36:47:DA:9C"
          EXPECTED_SHA256="1B:44:72:02:5C:8F:53:1E:32:55:57:1B:CA:47:C7:84:61:99:92:B1:8E:7A:69:00:87:A3:DB:07:0C:80:D2:4D"

          if [ "${HATCH_REQUIRE_PERSISTENT_SIGNING:-false}" = "true" ]; then
            if [ "$SHA1_FORMATTED" != "$EXPECTED_SHA1" ] || [ "$SHA256_FORMATTED" != "$EXPECTED_SHA256" ]; then
              echo "ERROR: APK signing fingerprints do NOT match the persistent HATCH signing key!"
              echo "Expected SHA-1  : $EXPECTED_SHA1"
              echo "Actual   SHA-1  : $SHA1_FORMATTED"
              echo "Expected SHA-256: $EXPECTED_SHA256"
              echo "Actual   SHA-256: $SHA256_FORMATTED"
              exit 1
            fi
            echo "Verified: APK signing fingerprints match the persistent HATCH signing key."
          fi

          {
            echo "### APK Signing Certificate Fingerprints"
            echo "- **Package:** \`com.hatch.marketplace\`"
            echo "- **SHA-1:** \`$SHA1_FORMATTED\`"
            echo "- **SHA-256:** \`$SHA256_FORMATTED\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK Installability, Signature, DEX & Resources
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH was not generated or is empty."
            exit 1
          fi

          ls -lh "$APK_PATH"

          echo "=== 1. ZIP & Core APK Entries (Manifest, DEX, Resources) ==="
          unzip -t "$APK_PATH" >/dev/null
          MANIFEST_COUNT=$(unzip -l "$APK_PATH" | grep -c "AndroidManifest\.xml" || true)
          DEX_COUNT=$(unzip -l "$APK_PATH" | grep -cE "classes[0-9]*\.dex" || true)
          RES_COUNT=$(unzip -l "$APK_PATH" | grep -c "resources\.arsc" || true)
          echo "Manifest entries: $MANIFEST_COUNT | DEX entries: $DEX_COUNT | resources.arsc: $RES_COUNT"
          if [ "$MANIFEST_COUNT" -lt 1 ] || [ "$DEX_COUNT" -lt 1 ] || [ "$RES_COUNT" -lt 1 ]; then
            echo "ERROR: Missing core APK component (Manifest/DEX/resources.arsc)."
            exit 1
          fi

          echo "=== 2. Native ABIs Packaged ==="
          unzip -l "$APK_PATH" | grep "lib/" || echo "No native .so libs (pure DEX/bytecode compatible with all ABIs)"

          echo "=== 3. Zipalign Verification ==="
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$APK_PATH"

          echo "=== 4. apksigner Verify (v1 + v2 + v3) ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --min-sdk-version 23 \
            --verbose \
            "$APK_PATH"

          echo "=== 5. AAPT2 Manifest, Package, SDK & Launchable Activity ==="
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_PATH")
          echo "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label|launchable-activity:|native-code:)"

          if echo "$BADGING" | grep -q "testOnly='-1'"; then
            echo "ERROR: APK has testOnly flag which blocks standard phone installation!"
            exit 1
          fi

          if ! echo "$BADGING" | grep -q "package: name='com.hatch.marketplace'"; then
            echo "ERROR: Unexpected package name."
            exit 1
          fi

          echo "Verified installable, signed, zipaligned HATCH APK at android-native/$APK_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app-debug.apk Artifact
        if: success() && github.event_name != 'pull_request' && env.HATCH_REQUIRE_PERSISTENT_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hatch-app-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean Up Temporary Signing Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/hatch-signing.jks"
          echo "Temporary signing keystore removed."
