name: Build HATCH Android Native APK

on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build & Verify HATCH Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses & Install Platform 35 + Build Tools 35.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure optional Firebase google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json configured from repository secret."
          else
            echo "No GOOGLE_SERVICES_JSON secret provided; building experimental APK with Firebase fallback."
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          gradle-home-cache-cleanup: true

      - name: Run Unit Tests & Assemble Debug APK (android-native only)
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Installability, Signature, DEX & Resources
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH was not generated or is empty."
            exit 1
          fi

          ls -lh "$APK_PATH"

          echo "=== 1. ZIP & Core APK Entries (Manifest, DEX, Resources) ==="
          unzip -t "$APK_PATH" >/dev/null
          MANIFEST_COUNT=$(unzip -l "$APK_PATH" | grep -c "AndroidManifest\.xml" || true)
          DEX_COUNT=$(unzip -l "$APK_PATH" | grep -cE "classes[0-9]*\.dex" || true)
          RES_COUNT=$(unzip -l "$APK_PATH" | grep -c "resources\.arsc" || true)
          echo "Manifest entries: $MANIFEST_COUNT | DEX entries: $DEX_COUNT | resources.arsc: $RES_COUNT"
          if [ "$MANIFEST_COUNT" -lt 1 ] || [ "$DEX_COUNT" -lt 1 ] || [ "$RES_COUNT" -lt 1 ]; then
            echo "ERROR: Missing core APK component (Manifest/DEX/resources.arsc)."
            exit 1
          fi

          echo "=== 2. Native ABIs Packaged ==="
          unzip -l "$APK_PATH" | grep "lib/" || echo "No native .so libs (pure DEX/bytecode compatible with all ABIs)"

          echo "=== 3. Zipalign Verification ==="
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$APK_PATH"

          echo "=== 4. apksigner Verify (v1 + v2 + v3) ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --min-sdk-version 23 \
            --verbose \
            --print-certs \
            "$APK_PATH"

          echo "=== 5. AAPT2 Manifest, Package, SDK & Launchable Activity ==="
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_PATH")
          echo "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label|launchable-activity:|native-code:)"

          if echo "$BADGING" | grep -q "testOnly='-1'"; then
            echo "ERROR: APK has testOnly flag which blocks standard phone installation!"
            exit 1
          fi

          if ! echo "$BADGING" | grep -q "package: name='com.hatch.marketplace'"; then
            echo "ERROR: Unexpected package name."
            exit 1
          fi

          echo "Verified installable, signed, zipaligned HATCH APK at android-native/$APK_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatch-app-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
