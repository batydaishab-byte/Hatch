name: Verify HATCH Firestore Security Rules

on:
  push:
    paths:
      - 'firestore.rules'
      - 'firestore.rules.test.ts'
      - 'package.json'
      - '.github/workflows/firestore-rules-tests.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.rules.test.ts'
      - 'package.json'
      - '.github/workflows/firestore-rules-tests.yml'
  workflow_dispatch:

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-rules-test:
    name: Lint Rules & Run Firestore Emulator Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21 (Temurin) for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Firebase CLI (pinned version)
        run: npm install -g --no-audit --no-fund firebase-tools@15.34.1

      - name: Lint Firestore Security Rules & TypeScript
        run: |
          npx eslint firestore.rules
          npx tsc --noEmit

      - name: Run Firestore Security Rules Unit Tests in Emulator
        run: |
          cat > /tmp/firebase.ci.json <<'EOF'
          {
            "firestore": {
              "rules": "firestore.rules",
              "host": "127.0.0.1",
              "port": 8080
            }
          }
          EOF
          firebase --config /tmp/firebase.ci.json --project rare-lambda-l7cdj emulators:exec --only firestore "npx vitest run firestore.rules.test.ts"
